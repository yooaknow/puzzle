<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>푸러봐</title>
    <meta name="description" content="하고 싶은 말을 퍼즐로 보내보세요. 조각을 다 맞춰야 숨겨둔 메시지가 보여요." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-title" content="푸러봐" />

    <!-- 카카오톡·문자 등에 링크를 보냈을 때 뜨는 미리보기. 이미지는 절대 주소여야 카톡이 읽는다. -->
    <!-- 여기는 첫 화면 주소용이고, 퍼즐 링크·프로필 링크용은 scripts/make-share-pages.mjs가 빌드 때 따로 만든다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="푸러봐" />
    <meta property="og:title" content="푸러봐 · 맞춰야 보이는 메시지" />
    <meta property="og:description" content="하고 싶은 말을 사진 퍼즐에 숨겨서 보내보세요. 조각을 다 맞춰야 보여요." />
    <meta property="og:image" content="https://puzzle-theta-nine.vercel.app/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="노란 퍼즐 조각 캐릭터와 푸러봐 로고" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      푸러봐를 쓰려면 JavaScript를 켜주세요.
    </noscript>
    <div id="root"></div>
  </body>
</html>
